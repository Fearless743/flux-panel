[package]
name = "flux-agent"
version = "0.1.0"
edition = "2021"
rust-version = "1.86"
description = "flux-panel 节点端代理（go-gost 完整 Rust 移植）"
license = "MIT"

[[bin]]
name = "flux_agent"
path = "src/main.rs"

[profile.release]
opt-level = "z"     # 体积优化
lto = "fat"         # 链接时优化
codegen-units = 1
strip = "symbols"   # 移除符号表
panic = "abort"     # 不展开栈
incremental = false

[profile.dev]
opt-level = 0
debug = true
incremental = true

[dependencies]
# 异步运行时
tokio = { version = "1.38", features = ["full"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["io", "rt"] }

# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
humantime-serde = "1"

# 加密（AES-GCM，与 Java 端 AES/GCM/NoPadding 兼容）
aes-gcm = "0.10"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"

# 压缩（gzip）
flate2 = "1"

# WebSocket（ws/wss）
tokio-tungstenite = { version = "0.23", features = ["rustls-tls-webpki-roots", "url"] }
futures-util = "0.3"

# HTTP 客户端
reqwest = { version = "0.12", features = ["rustls-tls", "json"], default-features = false }

# 日志
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }

# 错误
thiserror = "1"
anyhow = "1"

# 时间
chrono = { version = "0.4", features = ["serde"] }

# 命令行参数
clap = { version = "4", features = ["derive", "env"] }

# 并发原语
dashmap = "6"
arc-swap = "1"
once_cell = "1"
parking_lot = "0.12"
async-trait = "0.1"

# 系统信息
sysinfo = { version = "0.31", default-features = false, features = ["system"] }

# UUID
uuid = { version = "1", features = ["v4", "serde"] }

# 进程/procfs
procfs = "0.16"

# netlink（router 路由表，阶段 8 才用）
rtnetlink = { version = "0.13", optional = true }

# 限速（governor）
governor = "0.6"
nonzero_ext = "0.3"

# socket 选项（SO_REUSEADDR、linger）
socket2 = { version = "0.5", features = ["all"] }

# 二进制位/字节序（relay 协议）
bytes = "1"
byteorder = "1"

# 异步 IO trait（自定义 Connection 抽象）
tokio-io-timeout = "1"

# 异步 traits 实用工具（已在上面声明）

# anyhow 大型 Result（已在上面声明）

# 指标（prometheus，阶段 9 才用）
prometheus = { version = "0.13", optional = true }

# IP/CIDR（CIDR 范围查询）
ipnetwork = { version = "0.20", features = ["serde"] }
cidr = "0.2"

# SOCKS5 / SOCKS4 实现
socks5-impl = "0.9"
fast-socks5 = "0.10"

[dev-dependencies]
tokio = { version = "1.38", features = ["full", "test-util"] }
criterion = { version = "0.5", features = ["html_reports"] }
pretty_assertions = "1"

[features]
default = ["rtnetlink", "prometheus"]
full = ["rtnetlink", "prometheus"]

[workspace]
# 单 crate，但保留 [workspace] 便于未来拆分
members = ["."]