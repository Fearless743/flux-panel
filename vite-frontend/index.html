<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <title>flux-panel</title>
    <script>
      // 防止暗黑模式闪烁：在页面加载前立即应用系统主题
      (function() {
        const isDarkMode = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;

        if (isDarkMode) {
          document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = 'dark';
        } else {
          document.documentElement.classList.remove('dark');
          document.documentElement.style.colorScheme = 'light';
        }

        if (window.matchMedia) {
          window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(e) {
            if (e.matches) {
              document.documentElement.classList.add('dark');
              document.documentElement.style.colorScheme = 'dark';
            } else {
              document.documentElement.classList.remove('dark');
              document.documentElement.style.colorScheme = 'light';
            }
          });
        }

        // 检测 H5 模式并设置标记，避免布局切换时的闪屏
        const isMobile = window.innerWidth <= 768;
        const isMobileBrowser = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        const urlParams = new URLSearchParams(window.location.search);
        const isH5Param = urlParams.get('h5') === 'true';

        if (isMobile || isMobileBrowser || isH5Param) {
          document.documentElement.classList.add('h5-mode');
        } else {
          document.documentElement.classList.add('pc-mode');
        }
      })();
    </script>
    <style>
      :root {
        --toaster-bg: #ffffff;
        --toaster-color: #0f172a;
        --toaster-border: rgba(15, 23, 42, 0.1);
        --boot-bg: #f4f7fb;
        --boot-fg: #0f172a;
      }

      html.dark {
        --toaster-bg: #111a2b;
        --toaster-color: #e8eef9;
        --toaster-border: rgba(148, 163, 184, 0.18);
        --boot-bg: #0b1220;
        --boot-fg: #e8eef9;
      }

      * {
        box-sizing: border-box;
      }

      html {
        overscroll-behavior: none;
      }

      body {
        margin: 0;
        padding: 0;
        background-color: var(--boot-bg);
        color: var(--boot-fg);
        font-family: "IBM Plex Sans", "Noto Sans SC", ui-sans-serif, system-ui, sans-serif;
        overscroll-behavior: none;
        -webkit-overflow-scrolling: touch;
      }

      #root {
        min-height: 100vh;
        background-color: var(--boot-bg);
        overscroll-behavior: none;
      }

      @supports (height: 100dvh) {
        #root { min-height: 100dvh; }
      }

      @supports (-webkit-touch-callout: none) {
        #root { min-height: -webkit-fill-available; }
      }

      .h5-mode #root,
      .pc-mode #root {
        background-color: var(--boot-bg);
      }

      @media (max-width: 768px) {
        html, body {
          overscroll-behavior: none;
          -webkit-overflow-scrolling: touch;
        }

        .fixed {
          overscroll-behavior: none;
        }
      }
    </style>
    <meta key="title" content="flux-panel" property="og:title" />
    <meta content="flux-panel" property="og:description" />
    <meta content="flux-panel" name="description" />
    <meta
      key="viewport"
      content="viewport-fit=cover, width=device-width, initial-scale=1.0, user-scalable=no"
      name="viewport"
    />
    <link href="/favicon.ico" rel="icon" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
