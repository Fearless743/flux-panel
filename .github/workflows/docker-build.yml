name: Build and Release on Tag

# 推送以数字开头的 tag 时触发（如 2.0.8-beta），版本号直接取 tag 名
on:
  push:
    tags:
      - '[0-9]*'

jobs:
  build-gost:
    name: Build & Compress GOST Binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          # go-gost go.mod 要求 1.23+（toolchain go1.23.4）
          go-version: '1.23.4'

      - name: Cache Go modules
        uses: actions/cache@v3
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('go-gost/**/go.sum', 'go-backend/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Install UPX
        run: |
          wget https://github.com/upx/upx/releases/download/v4.2.1/upx-4.2.1-amd64_linux.tar.xz
          tar -xf upx-4.2.1-amd64_linux.tar.xz
          sudo mv upx-4.2.1-amd64_linux/upx /usr/local/bin/
          rm -rf upx-4.2.1-amd64_linux*

      - name: Build GOST binary (AMD64)
        working-directory: ./go-gost
        run: |
          VERSION="${{ github.ref_name }}"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
            -ldflags="-s -w -X main.version=${VERSION}" \
            -o gost-amd64

      - name: Build GOST binary (ARM64)
        working-directory: ./go-gost
        run: |
          VERSION="${{ github.ref_name }}"
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build \
            -ldflags="-s -w -X main.version=${VERSION}" \
            -o gost-arm64

      - name: Compress with UPX (AMD64)
        working-directory: ./go-gost
        run: |
          upx --best --lzma gost-amd64

      - name: Compress with UPX (ARM64)
        working-directory: ./go-gost
        run: |
          upx --best --lzma gost-arm64

      - name: Upload GOST AMD64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: gost-binary-amd64
          path: ./go-gost/gost-amd64

      - name: Upload GOST ARM64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: gost-binary-arm64
          path: ./go-gost/gost-arm64

  build-panel:
    name: Build & Push All-in-One Panel (Caddy + Go + Frontend)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push panel image
        run: |
          VERSION="${{ github.ref_name }}"
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          # 唯一面板镜像；兼容别名便于旧文档/脚本过渡
          # APP_VERSION 注入前端，管理后台显示与本次 tag 一致
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --build-arg APP_VERSION="${VERSION}" \
            --push \
            -t ghcr.io/${OWNER}/flux-panel:latest \
            -t ghcr.io/${OWNER}/flux-panel:${VERSION} \
            -t ghcr.io/${OWNER}/go-backend:latest \
            -t ghcr.io/${OWNER}/go-backend:${VERSION} \
            -f Dockerfile \
            .

  create-release:
    name: Create Release
    needs: [build-gost, build-panel]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3

      - name: Download GOST AMD64 binary
        uses: actions/download-artifact@v4
        with:
          name: gost-binary-amd64
          path: ./artifacts/amd64

      - name: Download GOST ARM64 binary
        uses: actions/download-artifact@v4
        with:
          name: gost-binary-arm64
          path: ./artifacts/arm64

      - name: Rename binaries
        run: |
          mv ./artifacts/amd64/gost-amd64 ./artifacts/gost-amd64
          mv ./artifacts/arm64/gost-arm64 ./artifacts/gost-arm64

      - name: Create Release and upload files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ github.ref_name }}"
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"

          COMMIT_MSG=$(git log -1 --pretty=format:"%s")
          COMMIT_AUTHOR=$(git log -1 --pretty=format:"%an")
          COMMIT_DATE=$(git log -1 --pretty=format:"%ai")

          if ! gh release view "${VERSION}" --repo ${{ github.repository }} >/dev/null 2>&1; then
            gh release create "${VERSION}" \
              --title "Release ${VERSION}" \
              --notes "## 📝 Commit Information
          - **Message**: ${COMMIT_MSG}
          - **Author**: ${COMMIT_AUTHOR}
          - **Date**: ${COMMIT_DATE}
          - **Commit**: [\`${GITHUB_SHA:0:7}\`](https://github.com/${{ github.repository }}/commit/${{ github.sha }})

          ## 📦 Images
          - \`ghcr.io/${OWNER}/flux-panel:${VERSION}\` — **唯一面板镜像**（Caddy + Go 后端 + 前端）
          - 兼容标签：\`go-backend:${VERSION}\`（同一镜像）
          - 对外端口 **80**（compose 映射 \`PANEL_PORT\`，默认 6366）
          - 节点请将面板地址配到该端口；\`/api\` \`/flow\` \`/system-info\` 由 Caddy 反代" \
              --repo ${{ github.repository }}
          fi

          echo "📤 上传 GOST 二进制文件..."
          gh release upload "${VERSION}" ./artifacts/gost-amd64 --clobber
          gh release upload "${VERSION}" ./artifacts/gost-arm64 --clobber

          echo "✅ 二进制文件已上传到 Release ${VERSION}"
