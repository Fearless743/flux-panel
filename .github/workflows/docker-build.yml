name: Build and Release on Tag

# 推送以数字开头的 tag 时触发（如 2.0.8-beta），版本号直接取 tag 名
on:
  push:
    tags:
      - '[0-9]*'

env:
  # 统一 owner 小写，避免 GHCR 路径大小写问题
  REGISTRY: ghcr.io

jobs:
  build-gost:
    name: Build & Compress GOST Binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # go-gost go.mod 要求 1.23+（toolchain go1.23.4）
          go-version: '1.23.4'
          cache-dependency-path: go-gost/go.sum

      - name: Install UPX
        run: |
          # 固定版本，apt 缓存更快；失败再回退到 release 包
          sudo apt-get update -qq
          sudo apt-get install -y -qq upx-ucl || {
            wget -q https://github.com/upx/upx/releases/download/v4.2.4/upx-4.2.4-amd64_linux.tar.xz
            tar -xf upx-4.2.4-amd64_linux.tar.xz
            sudo mv upx-4.2.4-amd64_linux/upx /usr/local/bin/
            rm -rf upx-4.2.4-amd64_linux*
          }
          upx --version

      # amd64 / arm64 并行编译，缩短 wall-clock
      - name: Build GOST binaries (amd64 + arm64)
        working-directory: ./go-gost
        run: |
          VERSION="${{ github.ref_name }}"
          LDFLAGS="-s -w -X main.version=${VERSION}"

          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
            -ldflags="${LDFLAGS}" -o gost-amd64 &
          pid_amd=$!

          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build \
            -ldflags="${LDFLAGS}" -o gost-arm64 &
          pid_arm=$!

          wait $pid_amd
          wait $pid_arm
          ls -lh gost-amd64 gost-arm64

      # -9 比 --best --lzma 快数倍，体积接近；并行压缩
      - name: Compress with UPX
        working-directory: ./go-gost
        run: |
          upx -9 gost-amd64 &
          pid_amd=$!
          upx -9 gost-arm64 &
          pid_arm=$!
          wait $pid_amd
          wait $pid_arm
          ls -lh gost-amd64 gost-arm64

      - name: Upload GOST AMD64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: gost-binary-amd64
          path: ./go-gost/gost-amd64
          if-no-files-found: error

      - name: Upload GOST ARM64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: gost-binary-arm64
          path: ./go-gost/gost-arm64
          if-no-files-found: error

  build-panel:
    name: Build & Push All-in-One Panel (Caddy + Go + Frontend)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR 路径必须全小写
      - name: Normalize owner
        id: owner
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          # 唯一面板镜像（Caddy + Go + Frontend）
          images: |
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.name }}/flux-panel
          tags: |
            type=raw,value=latest
            type=raw,value=${{ github.ref_name }}
          labels: |
            org.opencontainers.image.title=flux-panel
            org.opencontainers.image.description=All-in-one panel (Caddy + Go + Frontend)

      # GHA 缓存跨 run 复用层；mode=max 缓存所有中间 stage（frontend/backend）
      # 前端/后端 stage 已固定 BUILDPLATFORM，arm64 仅交叉编译 Go，避免 QEMU 跑 npm
      - name: Build and push panel image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ github.ref_name }}
          cache-from: type=gha,scope=panel
          cache-to: type=gha,mode=max,scope=panel
          provenance: false

  create-release:
    name: Create Release
    needs: [build-gost]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download GOST AMD64 binary
        uses: actions/download-artifact@v4
        with:
          name: gost-binary-amd64
          path: ./artifacts/amd64

      - name: Download GOST ARM64 binary
        uses: actions/download-artifact@v4
        with:
          name: gost-binary-arm64
          path: ./artifacts/arm64

      - name: Rename binaries
        run: |
          mv ./artifacts/amd64/gost-amd64 ./artifacts/gost-amd64
          mv ./artifacts/arm64/gost-arm64 ./artifacts/gost-arm64

      - name: Create Release and upload files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ github.ref_name }}"
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"

          COMMIT_MSG=$(git log -1 --pretty=format:"%s")
          COMMIT_AUTHOR=$(git log -1 --pretty=format:"%an")
          COMMIT_DATE=$(git log -1 --pretty=format:"%ai")

          if ! gh release view "${VERSION}" --repo ${{ github.repository }} >/dev/null 2>&1; then
            gh release create "${VERSION}" \
              --title "Release ${VERSION}" \
              --notes "## 📝 Commit Information
          - **Message**: ${COMMIT_MSG}
          - **Author**: ${COMMIT_AUTHOR}
          - **Date**: ${COMMIT_DATE}
          - **Commit**: [\`${GITHUB_SHA:0:7}\`](https://github.com/${{ github.repository }}/commit/${{ github.sha }})

          ## 📦 Images
          - \`ghcr.io/${OWNER}/flux-panel:${VERSION}\` — 面板镜像（Caddy + Go 后端 + 前端）
          - 对外端口 **80**（compose 映射 \`PANEL_PORT\`，默认 6366）
          - 节点请将面板地址配到该端口；\`/api\` \`/flow\` \`/system-info\` 由 Caddy 反代" \
              --repo ${{ github.repository }}
          fi

          echo "📤 上传 GOST 二进制文件..."
          gh release upload "${VERSION}" ./artifacts/gost-amd64 --clobber
          gh release upload "${VERSION}" ./artifacts/gost-arm64 --clobber

          echo "✅ 二进制文件已上传到 Release ${VERSION}"
