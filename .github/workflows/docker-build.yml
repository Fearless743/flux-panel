name: Build and Release on Tag

# 推送以数字开头的 tag 时触发（如 2.0.8-beta），版本号直接取 tag 名
on:
  push:
    tags:
      - '[0-9]*'

jobs:
  build-rust:
    name: Build Rust flux_agent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain 1.86
        uses: dtolnay/rust-toolchain@1.86.0
        with:
          targets: x86_64-unknown-linux-gnu,aarch64-unknown-linux-gnu

      - name: Install cross-compilation toolchain (ARM64)
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: gost-rs -> target

      - name: Build release binary (AMD64)
        working-directory: ./gost-rs
        run: cargo build --release --target x86_64-unknown-linux-gnu --bin flux_agent

      - name: Build release binary (ARM64)
        working-directory: ./gost-rs
        env:
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release --target aarch64-unknown-linux-gnu --bin flux_agent

      - name: Copy to artifact name (AMD64)
        working-directory: ./gost-rs
        run: |
          cp target/x86_64-unknown-linux-gnu/release/flux_agent ./gost-amd64
          chmod +x ./gost-amd64

      - name: Copy to artifact name (ARM64)
        working-directory: ./gost-rs
        run: |
          cp target/aarch64-unknown-linux-gnu/release/flux_agent ./gost-arm64
          chmod +x ./gost-arm64

      - name: Upload AMD64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: gost-binary-amd64
          path: ./gost-rs/gost-amd64

      - name: Upload ARM64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: gost-binary-arm64
          path: ./gost-rs/gost-arm64

  build-vite:
    name: Build & Push Vite Frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Vite Docker images
        run: |
          VERSION="${{ github.ref_name }}"
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --push \
            -t ghcr.io/${OWNER}/vite-frontend:latest \
            -t ghcr.io/${OWNER}/vite-frontend:${VERSION} \
            ./vite-frontend

  build-java:
    name: Build & Push Spring Boot Backend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK and Maven
        uses: actions/setup-java@v3
        with:
          java-version: 21
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Build Java JAR
        working-directory: ./springboot-backend
        run: mvn clean package -DskipTests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Java Docker images
        run: |
          VERSION="${{ github.ref_name }}"
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --push \
            -t ghcr.io/${OWNER}/springboot-backend:latest \
            -t ghcr.io/${OWNER}/springboot-backend:${VERSION} \
            ./springboot-backend

  create-release:
    name: Create Release
    needs: [build-rust, build-vite, build-java]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3

      - name: Download GOST AMD64 binary
        uses: actions/download-artifact@v4
        with:
          name: gost-binary-amd64
          path: ./artifacts/amd64

      - name: Download GOST ARM64 binary
        uses: actions/download-artifact@v4
        with:
          name: gost-binary-arm64
          path: ./artifacts/arm64

      - name: Rename binaries
        run: |
          mv ./artifacts/amd64/gost-amd64 ./artifacts/gost-amd64
          mv ./artifacts/arm64/gost-arm64 ./artifacts/gost-arm64

      - name: Create Release and upload files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ github.ref_name }}"

          # 获取 commit 信息
          COMMIT_MSG=$(git log -1 --pretty=format:"%s")
          COMMIT_AUTHOR=$(git log -1 --pretty=format:"%an")
          COMMIT_DATE=$(git log -1 --pretty=format:"%ai")

          # 创建 release（已存在则跳过，仅更新附件）
          if ! gh release view "${VERSION}" --repo ${{ github.repository }} >/dev/null 2>&1; then
            gh release create "${VERSION}" \
              --title "Release ${VERSION}" \
              --notes "## 📝 Commit Information
          - **Message**: ${COMMIT_MSG}
          - **Author**: ${COMMIT_AUTHOR}
          - **Date**: ${COMMIT_DATE}
          - **Commit**: [\`${GITHUB_SHA:0:7}\`](https://github.com/${{ github.repository }}/commit/${{ github.sha }})" \
              --repo ${{ github.repository }}
          fi

          # 只上传二进制文件到 release，安装脚本和配置文件通过仓库 raw 地址分发
          echo "📤 上传 GOST 二进制文件..."
          gh release upload "${VERSION}" ./artifacts/gost-amd64 --clobber
          gh release upload "${VERSION}" ./artifacts/gost-arm64 --clobber

          echo "✅ 二进制文件已上传到 Release ${VERSION}"
