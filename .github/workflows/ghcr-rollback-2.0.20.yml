# 一次性回滚任务（workflow_dispatch）
# 背景：本地 PAT 无 packages scope（GHCR token 被降级为 pull-only，registry DELETE 返回 405 UNSUPPORTED），
#       故通过 CI 的 GITHUB_TOKEN（permissions: packages:write）执行所有 GHCR 变更。
# 顺序刻意：先删高位 release/tag → 重指向 latest → 删高位镜像版本 → 最后创建 2.0.20-beta release，
#           使 GitHub "latest" 指针落在 2.0.20-beta（install.sh 依赖 releases/latest）。
name: ghcr-rollback-2.0.20
on:
  workflow_dispatch: {}

permissions:
  contents: write
  packages: write

jobs:
  rollback:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      OWNER: fearless743
      IMAGE: ghcr.io/fearless743/flux-panel
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Checkout 2.0.20-beta sources
        run: |
          git checkout 2.0.20-beta
          git rev-parse --short HEAD

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.4'
          cache-dependency-path: go-gost/go.sum

      - name: Install crane
        run: |
          go install github.com/google/go-containerregistry/cmd/crane@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          crane version

      - name: Install UPX
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq upx-ucl || {
            wget -q https://github.com/upx/upx/releases/download/v4.2.4/upx-4.2.4-amd64_linux.tar.xz
            tar -xf upx-4.2.4-amd64_linux.tar.xz
            sudo mv upx-4.2.4-amd64_linux/upx /usr/local/bin/
            rm -rf upx-4.2.4-amd64_linux*
          }
          upx --version

      - name: Build GOST binaries (amd64 + arm64)
        working-directory: ./go-gost
        run: |
          VERSION="2.0.20-beta"
          LDFLAGS="-s -w -X main.version=${VERSION}"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="${LDFLAGS}" -o gost-amd64 &
          pid_amd=$!
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="${LDFLAGS}" -o gost-arm64 &
          pid_arm=$!
          wait $pid_amd
          wait $pid_arm
          ls -lh gost-amd64 gost-arm64

      - name: Compress with UPX
        working-directory: ./go-gost
        run: |
          upx -9 gost-amd64 &
          pid_amd=$!
          upx -9 gost-arm64 &
          pid_arm=$!
          wait $pid_amd
          wait $pid_arm
          ls -lh gost-amd64 gost-arm64

      - name: Delete higher GitHub releases
        run: |
          for r in 2.0.33-beta 2.0.32-beta 2.0.27-beta 2.0.26-beta 2.0.24-beta 2.0.23-beta 2.0.22-beta 2.0.21-beta; do
            if gh release view "$r" >/dev/null 2>&1; then
              gh release delete "$r"
              echo "deleted release $r"
            else
              echo "skip $r (absent)"
            fi
          done
          gh release list

      - name: Delete higher remote git tags (Packages/Refs API; `git push +:` is ambiguous post-tag-delete)
        run: |
          for t in 2.0.21-beta 2.0.22-beta 2.0.24-beta 2.0.27-beta 2.0.32-beta 2.0.33-beta; do
            SHA=$(git rev-parse "refs/tags/$t" 2>/dev/null || true)
            if [ -n "$SHA" ]; then
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$t" --silent \
                && echo "deleted git tag $t" || echo "skip git tag $t (gone)"
            else
              echo "skip git tag $t (gone)"
            fi
          done
          echo "=== tags left ==="
          git ls-remote --tags origin | sed 's|.*/||' | tr -d '^{}' | sort -V

      - name: Retag GHCR latest -> 2.0.20-beta
        run: |
          printf '%s' "$GITHUB_TOKEN" | crane auth login ghcr.io -u "${{ github.actor }}" --password-stdin
          echo "2.0.20-beta digest = $(crane digest "$IMAGE:2.0.20-beta")"
          # 注意：crane tag 的 DST 只能是裸标签名，不能带完整镜像路径
          crane tag "$IMAGE:2.0.20-beta" latest
          echo "latest digest      = $(crane digest "$IMAGE:latest")"

      - name: Delete higher GHCR image versions (Packages REST API; registry DELETE is unsupported on GHCR)
        run: |
          # 保留集合：2.0.20-beta 及更旧的版本标签，加 latest。
          # 版本按 digest 划分，删版本会同时删掉其全部标签，
          # 所以必须先完成上一步 latest 重指向，避免误删 2.0.20-beta 版本。
          KEEP="latest 2.0.20-beta 2.0.19-beta 2.0.18-beta 2.0.17-beta 2.0.16-beta 2.0.15-beta 2.0.14-beta"
          gh api "users/$OWNER/packages/container/flux-panel/versions?per_page=100&page=1" > /tmp/versions-1.json
          gh api "users/$OWNER/packages/container/flux-panel/versions?per_page=100&page=2" > /tmp/versions-2.json
          jq -s 'add' /tmp/versions-1.json /tmp/versions-2.json > /tmp/versions.json
          COUNT=$(jq length /tmp/versions.json)
          echo "package versions: $COUNT"
          if [ "$COUNT" -eq 0 ]; then exit 1; fi
          jq -r '.[] | "\(.id) \(.metadata.container.tags // [] | join(" "))"' /tmp/versions.json > /tmp/versions-ids.txt
          cat /tmp/versions-ids.txt
          while read -r id tags; do
            hit=0
            for t in $tags; do
              case " $KEEP " in *" $t "*) hit=1 ;; esac
            done
            if [ "$hit" -eq 0 ]; then
              gh api -X DELETE "users/$OWNER/packages/container/flux-panel/versions/$id" > /dev/null
              echo "deleted image version $id [$(echo $tags)]"
            else
              echo "keep image version $id [$(echo $tags)]"
            fi
          done < /tmp/versions-ids.txt

      - name: Create 2.0.20-beta release (last, so GitHub "latest" points here)
        run: |
          OWNER_LC="${GITHUB_REPOSITORY_OWNER,,}"
          SHA=$(git rev-parse '2.0.20-beta^{commit}')
          COMMIT_MSG=$(git log -1 --pretty=format:"%s" "$SHA")
          COMMIT_AUTHOR=$(git log -1 --pretty=format:"%an" "$SHA")
          COMMIT_DATE=$(git log -1 --pretty=format:"%ai" "$SHA")
          if ! gh release view 2.0.20-beta >/dev/null 2>&1; then
            gh release create 2.0.20-beta \
              --title "Release 2.0.20-beta" \
              --target "$SHA" \
              --notes "## 📝 Commit Information
          - **Message**: ${COMMIT_MSG}
          - **Author**: ${COMMIT_AUTHOR}
          - **Date**: ${COMMIT_DATE}
          - **Commit**: [\`${SHA:0:7}\`](https://github.com/${GITHUB_REPOSITORY}/commit/${SHA})

          ## 📦 Images
          - \`ghcr.io/${OWNER_LC}/flux-panel:2.0.20-beta\` — **唯一面板镜像**（Caddy + Go 后端 + 前端）
          - 兼容标签：\`go-backend:2.0.20-beta\`（同一镜像）
          - 对外端口 **80**（compose 映射 \`PANEL_PORT\`，默认 6366）
          - 节点请将面板地址配到该端口；\`/api\` \`/flow\` \`/system-info\` 由 Caddy 反代"
          fi
          gh release upload 2.0.20-beta ./go-gost/gost-amd64 ./go-gost/gost-arm64 --clobber
          echo "✅ Release 2.0.20-beta 已创建并上传二进制"

      - name: Verify final remote state
        run: |
          echo "=== releases ==="
          gh release list
          echo "=== releases/latest redirect ==="
          curl -s -o /dev/null -w "%{redirect_url}\n" "https://github.com/${GITHUB_REPOSITORY}/releases/latest"
          echo "=== tags ==="
          git ls-remote --tags origin | sed 's|.*/||' | tr -d '^{}' | sort -V
          echo "=== images ==="
          printf '%s' "$GITHUB_TOKEN" | crane auth login ghcr.io -u "${{ github.actor }}" --password-stdin
          crane ls "$IMAGE" | sort -V
          echo "=== latest digest vs 2.0.20-beta digest ==="
          crane digest "$IMAGE:latest"
          crane digest "$IMAGE:2.0.20-beta"
